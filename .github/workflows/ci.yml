name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The first release is macOS-only and the full suite exercises the real
    # launchd installer boundary. Linux correctly rejects those paths.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck
