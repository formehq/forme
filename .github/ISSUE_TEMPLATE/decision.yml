name: Owner decision
description: Record a product, contract, permission, privacy, or scope decision.
title: "[Decision] "
labels:
  - needs:owner-decision
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision required
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and recommendation
      description: Give the recommended option first, with concrete tradeoffs.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: What this changes or blocks
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Decide by
      placeholder: YYYY-MM-DD
    validations:
      required: true
